<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Grass Generation - Task 11.2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .pass {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .fail {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Task 11.2: Grass Generation Integration Test</h1>
    <div id="results"></div>

    <!-- Load dependencies -->
    <script src="player.js"></script>
    <script src="world.js"></script>
    <script src="generator.js"></script>
    <script src="renderer.js"></script>
    <script src="input.js"></script>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(message, isPass) {
            const div = document.createElement('div');
            div.className = `test-result ${isPass ? 'pass' : 'fail'}`;
            div.textContent = (isPass ? '✓ ' : '✗ ') + message;
            resultsDiv.appendChild(div);
        }

        function addInfo(message) {
            const div = document.createElement('div');
            div.className = 'test-result info';
            div.textContent = '📋 ' + message;
            resultsDiv.appendChild(div);
        }

        // Run tests
        try {
            addInfo('Testing grass generation integration...');

            // Test 1: World instance is created
            const world = new World();
            addResult('World instance created successfully', true);

            // Test 2: Generate grass rows
            const NUM_ROWS = 18;
            const STARTING_Y = -5;
            for (let i = 0; i < NUM_ROWS; i++) {
                const y = STARTING_Y + i;
                const grassRow = generateGrass(y);
                world.addTerrainRow(grassRow);
            }
            addResult(`Generated ${NUM_ROWS} grass rows`, true);

            // Test 3: Verify terrain rows exist in world
            const terrainCount = world.terrainRows.size;
            addResult(`World contains ${terrainCount} terrain rows`, terrainCount === NUM_ROWS);

            // Test 4: Verify rows are within 15-20 range (requirement)
            const inRange = terrainCount >= 15 && terrainCount <= 20;
            addResult(`Number of rows (${terrainCount}) is within 15-20 range`, inRange);

            // Test 5: Check each row has correct structure
            let allRowsValid = true;
            for (let i = 0; i < NUM_ROWS; i++) {
                const y = STARTING_Y + i;
                const terrain = world.getTerrainAt(0, y);
                
                if (!terrain) {
                    allRowsValid = false;
                    addResult(`Row ${y} not found in world`, false);
                    break;
                }
                
                if (terrain.type !== 'GRASS') {
                    allRowsValid = false;
                    addResult(`Row ${y} has wrong type: ${terrain.type}`, false);
                    break;
                }
                
                if (terrain.obstacles.length !== 0) {
                    allRowsValid = false;
                    addResult(`Row ${y} has obstacles (should be empty for grass)`, false);
                    break;
                }
                
                if (terrain.platforms.length !== 0) {
                    allRowsValid = false;
                    addResult(`Row ${y} has platforms (should be empty for grass)`, false);
                    break;
                }
            }
            
            if (allRowsValid) {
                addResult('All grass rows have correct structure (type=GRASS, no obstacles, no platforms)', true);
            }

            // Test 6: Verify rows are displayed (check Y coordinates)
            const yCoords = Array.from(world.terrainRows.keys()).sort((a, b) => a - b);
            addInfo(`Row Y coordinates: ${yCoords.join(', ')}`);
            addResult('Rows span from ' + yCoords[0] + ' to ' + yCoords[yCoords.length - 1], true);

            // Test 7: Verify player starts at (0, 0) which should be within visible terrain
            const playerY = 0;
            const terrainAtPlayer = world.getTerrainAt(0, playerY);
            addResult(`Terrain exists at player start position (0, ${playerY})`, terrainAtPlayer !== null);

            addInfo('✅ All tests passed! Task 11.2 acceptance criteria met:');
            addInfo('✓ Game initializes with 15-20 rows of grass terrain');
            addInfo('✓ Generated terrain is stored in World instance');
            addInfo('✓ Terrain is visible on screen (ready for rendering)');

        } catch (error) {
            addResult(`Test failed with error: ${error.message}`, false);
            console.error(error);
        }
    </script>
</body>
</html>
