<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with AI LeBron</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1d0b3a;
      color: #fff;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .chat {
      width: 100%;
      max-width: 560px;
      background: #2a1452;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat header {
      background: #552583; /* Lakers purple */
      border-bottom: 4px solid #fdb927; /* Lakers gold */
      padding: 16px;
    }
    .chat header h1 { margin: 0; font-size: 1.25rem; }
    .chat header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.8; }
    #messages {
      height: 420px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: #fdb927; color: #1d0b3a; }
    .msg.assistant { align-self: flex-start; background: #3d1f70; }
    .msg.error { align-self: center; background: #8b1e1e; font-size: 0.85rem; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #3d1f70;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #fdb927;
      color: #1d0b3a;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <h1>🏀 Chat with AI LeBron</h1>
      <p>An AI parody — not the real LeBron James. First reply may take ~30s while the server wakes up.</p>
    </header>

    <div id="messages"></div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask LeBron anything..." maxlength="500" autocomplete="off" required />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    // Replace with your Render service URL after deploying the backend.
    const API_URL = "https://lechat-s1pu.onrender.com/";

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");

    // Conversation history sent to the backend on each request.
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text; // textContent avoids injecting HTML
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    addMessage("assistant", "What's good! It's King James. What do you wanna talk about?");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addMessage("assistant", "...");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        thinking.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        thinking.remove();
        history.pop(); // drop the unanswered user message
        addMessage("error", err.message || "Something went wrong. Try again.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
